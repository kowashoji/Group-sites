name: Import live sites
on:
  push:
    paths: ['.github/import-trigger']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f6f599c75fe54a2dd5c2b7e05472d4a8
    steps:
      - uses: actions/checkout@v4
      - name: List Pages projects
        run: |
          mkdir -p _import
          npx -y wrangler@3 pages project list > _import/projects.txt 2>&1 || true
          cat _import/projects.txt
      - name: Mirror sites
        run: |
          for p in $(grep -oE '[a-z0-9-]+\.pages\.dev' _import/projects.txt | sort -u); do
            name=${p%.pages.dev}
            echo "== $name"
            mkdir -p "_import/$name" && cd "_import/$name"
            wget -q -r -l 10 -p -E -nH -e robots=off --content-on-error "https://$p/" || true
            for f in robots.txt sitemap.xml favicon.ico; do wget -q "https://$p/$f" -O "$f" || rm -f "$f"; done
            wget -q --content-on-error "https://$p/__missing__" -O 404.html || true
            curl -sI "https://$p/" > ../$name.headers.txt
            cd - >/dev/null
          done
          find _import -type f | sort > _import/files.txt
          wc -l _import/files.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add _import
          git commit -m "Import live sites" || echo nothing
          git push
