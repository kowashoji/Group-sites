name: Probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "東京都渋谷区渋谷1-3-18" "東京都渋谷区神宮前2-31-7" "東京都渋谷区神宮前2丁目31-7" "150-0001 東京都渋谷区神宮前2丁目31-7" "35.672966,139.709351 (東京都渋谷区神宮前2丁目31-7)"; do
            echo "=== $q"
            curl -sLG -A "Mozilla/5.0 (Macintosh)" -H "Accept-Language: ja" "https://maps.google.com/maps" --data-urlencode "q=$q" --data "z=16&output=embed" -o p.html
            wc -c < p.html
            grep -oE '\\"[^\\"]{0,80}(神宮前|渋谷|グロリア|Gloria|ビラ)[^\\"]{0,80}\\"' p.html | sort -u | head -6
            grep -o "initEmbed.*" p.html | grep -oE '"[^"]{2,120}"' | grep -vE "^\"(spotlit|/g/|https)" | head -12
            grep -oE '35\.6[0-9]{3,},139\.[0-9]{4,}' p.html | head -2
          done
